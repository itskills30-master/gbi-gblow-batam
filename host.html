<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Kelola Host</title>

<!-- Host CSS -->
<link rel="stylesheet" href="css/host.css">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ============================================
NAVBAR
============================================ -->
<nav class="navbar-custom">

    <div class="navbar-container">

        <button class="btn-back" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="navbar-title">
            <h5>
                <i class="fa-solid fa-server"></i> Kelola Host
            </h5>
            <small>
                <i class="fa-regular fa-clock"></i> 
                <span id="currentTime">Memuat...</span>
            </small>
        </div>

        <button class="btn-refresh" onclick="loadHost(true)">
            <i class="fa-solid fa-rotate-right"></i>
        </button>

    </div>

</nav>

<!-- ============================================
CONTENT
============================================ -->
<div class="container-custom">

    <!-- LOADING -->
    <div id="loadingHost" class="status-message">
        <div class="spinner"></div>
        <p class="mt-3">Memuat data Host...</p>
    </div>

    <!-- ERROR -->
    <div id="errorHost" class="status-message d-none">
        <i class="fa-solid fa-circle-exclamation icon-danger"></i>
        <p class="text-danger fw-bold" id="errorText">Terjadi kesalahan</p>
        <p class="text-muted small">Silakan coba lagi nanti</p>
    </div>

    <!-- EMPTY -->
    <div id="emptyHost" class="status-message d-none">
        <i class="fa-solid fa-inbox icon-secondary"></i>
        <p class="fw-bold">Belum ada Host</p>
        <p class="text-muted small">Silakan tambahkan host baru</p>
    </div>

    <!-- LIST HOST -->
    <div id="listHost" class="d-none"></div>

</div>

<!-- ============================================
JAVASCRIPT
============================================ -->
<script src="js/auth.js"></script>
<script src="js/panel.js"></script>
<script src="js/host.js"></script>

</body>

</html>
